charset utf-8;
client_max_body_size 2g;
client_body_timeout 120s;
client_body_temp_path @uploads@;
add_header Cache-Control "private, no-store" always;
add_header X-Content-Type-Options nosniff always;

location = / {
    limit_except GET { deny all; }
    index .l4d2-no-index;
    autoindex on;
    autoindex_format xml;
    xslt_stylesheet @stylesheet@;
}

location ~* "^/[^/.][^/]*\.(vpk|jpe?g|png|gif|webp)\z" {
    limit_except GET PUT { deny all; }
    disable_symlinks on;
    if (-d $request_filename) { return 404; }
    # DAV ignores disable_symlinks; check before writing.
    set $l4d2_file $request_filename;
    auth_request /.l4d2-check;
    dav_methods PUT;
    dav_access user:rw group:r all:r;
    create_full_put_path off;
    types {
        image/jpeg jpg jpeg;
        image/png png;
        image/gif gif;
        image/webp webp;
    }
    default_type application/octet-stream;
}

location = /.l4d2-check {
    internal;
    auth_basic off;
    alias $l4d2_file;
    disable_symlinks on;
    error_page 404 = @l4d2-missing;
}

location @l4d2-missing {
    return 204;
}

location / { return 404; }

name: "Flake Automated Update & Build"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - host: nixos
          runner: '["ubuntu-latest"]'
          self_hosted: false
        - host: hk
          runner: '["ubuntu-latest"]'
          self_hosted: false
        - host: rpi5
          runner: '["self-hosted", "Linux", "ARM64"]'
          self_hosted: true
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install nix
      if: ${{ !matrix.self_hosted }}
      uses: cachix/install-nix-action@v31

    - name: Set nix daemon tmp path
      if: ${{ !matrix.self_hosted }}
      run: |
        sudo mkdir --parents /nix/tmp
        sudo chmod 777 /nix/tmp

        cat > override.conf <<EOF
        [Service]
        Environment="TMPDIR=/nix/tmp"
        EOF
        sudo mkdir /etc/systemd/system/nix-daemon.service.d/
        sudo mv override.conf /etc/systemd/system/nix-daemon.service.d/override.conf
        sudo systemctl daemon-reload
        sudo systemctl restart nix-daemon

    - name: Configure git
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git config --global pull.rebase false

    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: antares0982
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        skipAddingSubstituter: ${{ matrix.self_hosted }}

    - name: Nix flake update
      env:
        HOST: ${{ matrix.host }}
      run: |
        nix flake update --flake "./hosts/${HOST}" --commit-lock-file

    - name: Check nixpkgs version and decide whether to build
      id: check
      env:
        HOST: ${{ matrix.host }}
      run: |
        set -euo pipefail

        lock_file="hosts/${HOST}/flake.lock"
        # Lock node names are implementation details and may be suffixed when
        # transitive inputs collide. Follow the root flake's nixpkgs edge to
        # find the node that this host actually uses.
        IFS=$'\t' read -r nixpkgs_node rev < <(
          jq -er '
            .root as $root
            | .nodes[$root].inputs.nixpkgs as $node
            | if ($node | type) != "string" then
                error("root input nixpkgs does not resolve to a lock node")
              else
                [
                  $node,
                  (.nodes[$node].locked.rev
                   // .nodes[$node].locked.revision
                   // error("root nixpkgs lock node has no revision"))
                ]
                | @tsv
              end
          ' "$lock_file"
        )

        echo "Resolved root nixpkgs input: node=${nixpkgs_node}, revision=${rev}"

        short_rev=${rev:0:12}
        branch="flake-update/${HOST}/nixpkgs-${short_rev}"

        echo "nixpkgs_rev=$rev" >> "$GITHUB_OUTPUT"
        echo "branch_name=$branch" >> "$GITHUB_OUTPUT"

        if git ls-remote --heads origin "$branch" | grep -q .; then
          # Branch exists. Only skip if it already contains the current
          # origin/master (i.e. it is a forward branch of master). If master
          # has advanced beyond it, the new master changes are missing and we
          # must rebuild.
          git fetch --quiet origin \
            "master:refs/remotes/origin/master" \
            "$branch:refs/remotes/origin/${branch}"

          if git merge-base --is-ancestor origin/master "origin/${branch}"; then
            echo "Branch $branch already contains origin/master -> skip build"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $branch is behind origin/master -> will rebuild and force push"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "Branch $branch not found on remote -> will build"
          echo "skip_build=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Nix build
      if: steps.check.outputs.skip_build == 'false'
      env:
        HOST: ${{ matrix.host }}
      run: |
        nix build -L "./hosts/${HOST}#nixosConfigurations.${HOST}.config.system.build.toplevel" --show-trace

    - name: Push branch
      if: steps.check.outputs.skip_build == 'false'
      env:
        BRANCH: ${{ steps.check.outputs.branch_name }}
      run: |
        git checkout -B "$BRANCH"
        git push --force-with-lease --set-upstream origin "$BRANCH"
